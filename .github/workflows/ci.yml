name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      - run: node --test .github/scripts/release.test.mjs

  image:
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Serialize the build, latest promotion and cleanup across all versions.
    concurrency:
      group: ghcr-publish
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: release
        run: node .github/scripts/release.mjs metadata
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.release.outputs.image }}:${{ steps.release.outputs.version }}
          labels: |
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Update latest and remove replaced images
        run: node .github/scripts/release.mjs publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ steps.release.outputs.image }}
          VERSION: ${{ steps.release.outputs.version }}
          DIGEST: ${{ steps.build.outputs.digest }}
